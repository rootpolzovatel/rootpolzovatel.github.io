<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Олимпиада по программированию</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<div class="container hidden" id="tasksPage">
			<h1>Базовые понятия информатики</h1>
			<div class="tasks">
				<label>
					Задание №1. Чем отличается комбинация клавиш Ctrl + C и Ctrl + V от Ctrl + X и
					Ctrl + V?
				</label>
				<textarea placeholder="Ваш ответ" rows="2"></textarea>

				<label>Задание №2. Объясните, почему для компьютера не имеет значения, на каком языке
					программирования написана программа.</label>
				<textarea placeholder="Ваш ответ" rows="2"></textarea>

				<label>Задание №3. Дайте определение термину «браузер»</label>
				<textarea placeholder="Ваш ответ" rows="2"></textarea>

				<label>Задание №4. Объясните, что такое ярлык, как он функционирует и что происходит
					при его удалении.</label>
				<textarea placeholder="Ваш ответ" rows="2"></textarea>

				<label>Задание №5. Расшифруйте следующие аббревиатуры, используемые в информатике и
					вычислительной технике: ЦП, ГП, ОЗУ, ПЗУ.</label>
				<textarea placeholder="Ваш ответ" rows="2"></textarea>

				<div style="display: flex; justify-content: space-between; margin-top: 24px">
					<button type="button" id="backToRegisterBtn" style="background: #9ca3af; width: 48%">
						Назад
					</button>
					<button type="button" id="toCodingBtn" style="width: 48%">
						Перейти к программированию
					</button>
				</div>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
