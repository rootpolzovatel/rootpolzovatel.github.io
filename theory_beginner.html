<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Теоретические задания</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<div class="container large">
			<h1>Базовые понятия информатики</h1>

			<div class="tasks">
				<label>
					<span class="task-number">Задание №1.</span> Объясните, что такое файл и папка. В чём между ними разница?
				</label>
				<textarea id="q1"></textarea>

				<label>
					<span class="task-number">Задание №2.</span>Чем отличается комбинация клавиш Ctrl + C и Ctrl + V от Ctrl + X и Ctrl + V?
				</label>
				<textarea id="q2"></textarea>

				<label>
					<span class="task-number">Задание №3.</span> Дайте определение термину «браузер»
				</label>
				<textarea id="q3"></textarea>

				<label>
					<span class="task-number">Задание №4.</span> Объясните, что такое ярлык, как он
					функционирует и что происходит при его удалении.
				</label>
				<textarea id="q4"></textarea>

				<label>
					<span class="task-number">Задание №5.</span> Перечислите основные части компьютера
				</label>
				<textarea id="q5"></textarea>

				<div class="row">
					<button id="backBtn" class="gray">Назад</button>
					<button id="toGuideBtn">Перейти к программированию</button>
				</div>
			</div>
		</div>

		<script src="theory.js"></script>
	</body>
</html>
